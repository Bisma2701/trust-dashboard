<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forgot Password - Trust Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap auth-wrap">
  <div class="card">
    <h2 class="section-title">Forgot Password</h2>
    <p class="section-sub">Enter your email to receive a reset link.</p>
    <div id="msg" style="display:none;"></div>

    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com">
    </div>

    <button class="btn btn-primary" id="resetBtn" style="width:100%; margin-top:15px;">Send Reset Link</button>

    <div class="auth-links">
      <a href="login.html">Back to Log In</a>
    </div>
  </div>
</div>

<script>
  document.getElementById('resetBtn').addEventListener('click', async () => {
    const email = document.getElementById('email').value;
    const msg = document.getElementById('msg');
    msg.classList.remove('form-error', 'form-success');

    if(!email) {
      msg.classList.add('form-error');
      msg.textContent = 'Please enter your email.';
      msg.style.display = 'block';
      return;
    }

    msg.textContent = 'Sending…';
    msg.style.display = 'block';

    try {
      const res = await fetch('/api/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await res.json();

      if(!res.ok) {
        msg.classList.add('form-error');
        msg.textContent = data.error || 'Failed to send reset link.';
      } else {
        msg.classList.add('form-success');
        msg.textContent = data.message;
      }
    } catch (e) {
      msg.classList.add('form-error');
      msg.textContent = 'An error occurred. Please try again.';
    }
  });
</script>
</body>
</html>
