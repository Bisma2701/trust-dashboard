<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset Password - Trust Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap auth-wrap">
  <div class="card">
    <h2 class="section-title">Reset Password</h2>
    <p class="section-sub">Enter your new password below.</p>
    <div id="msg" style="display:none;"></div>

    <div class="field">
      <label>New Password</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>

    <button class="btn btn-primary" id="resetBtn" style="width:100%; margin-top:15px;">Reset Password</button>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token');
  const email = urlParams.get('email');

  if(!token || !email) {
    const msg = document.getElementById('msg');
    msg.classList.add('form-error');
    msg.textContent = 'Invalid or missing reset token.';
    msg.style.display = 'block';
    document.getElementById('resetBtn').disabled = true;
  }

  document.getElementById('resetBtn').addEventListener('click', async () => {
    const password = document.getElementById('password').value;
    const msg = document.getElementById('msg');
    msg.classList.remove('form-error', 'form-success');

    if(!password) {
      msg.classList.add('form-error');
      msg.textContent = 'Please enter a new password.';
      msg.style.display = 'block';
      return;
    }

    try {
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, token, newPassword: password })
      });
      const data = await res.json();

      if(!res.ok) {
        msg.classList.add('form-error');
        msg.textContent = data.error || 'Failed to reset password.';
        msg.style.display = 'block';
      } else {
        msg.classList.add('form-success');
        msg.innerHTML = `${data.message}. <br><br><a href="login.html" class="form-link">Click here to log in.</a>`;
        msg.style.display = 'block';
        document.getElementById('resetBtn').style.display = 'none';
      }
    } catch (e) {
      msg.classList.add('form-error');
      msg.textContent = 'An error occurred. Please try again.';
      msg.style.display = 'block';
    }
  });
</script>
</body>
</html>
